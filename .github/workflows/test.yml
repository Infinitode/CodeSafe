name: Tests ✅

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Run tests (Python ${{ matrix.python-version }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ['3.10', '3.11', '3.12']
        include:
          # Python 3.8/3.9 are not available in the ubuntu-latest (24.04)
          # toolcache, so they run on ubuntu-22.04 instead.
          - os: ubuntu-22.04
            python-version: '3.8'
          - os: ubuntu-22.04
            python-version: '3.9'
          - os: windows-latest
            python-version: '3.12'
          - os: macos-latest
            python-version: '3.12'

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        # The test suite imports codesafe from the repository root, so the
        # package itself does not need to be built; only its runtime
        # dependencies are required.
        run: |
          python -m pip install --upgrade pip
          python -m pip install "cryptography>=41"

      - name: Diagnostics
        if: always()
        run: python diag_test.py

      - name: Run test suite
        run: python -m unittest test.py test_poc_vulnerability.py -v
