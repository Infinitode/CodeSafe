name: Publish Python 🐍 distributions 📦 to PyPI

on:
  push:
    tags:
      - '*'

jobs:
  build-n-publish:
    name: Build and publish Python 🐍 distributions 📦 to PyPI
    runs-on: ubuntu-latest

    # Required for PyPI Trusted Publishing (OIDC). No API token or
    # password is stored in this repository. The token is minted on
    # demand by GitHub and verified by PyPI against the trusted
    # publisher configuration for this project.
    permissions:
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install build tooling
        run: python -m pip install --upgrade pip build

      - name: Verify that the tag matches the package version
        run: |
          TAG_NAME="${GITHUB_REF_NAME#v}"
          PACKAGE_VERSION=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")
          echo "Tag: $TAG_NAME"
          echo "Package version: $PACKAGE_VERSION"
          if [ "$TAG_NAME" != "$PACKAGE_VERSION" ]; then
            echo "::error::Tag '${GITHUB_REF_NAME}' does not match the version '${PACKAGE_VERSION}' in pyproject.toml."
            exit 1
          fi

      - name: Build a binary wheel and source distribution
        run: python -m build

      # Publishes via PyPI Trusted Publishing (OIDC). The distribution
      # is attested (PEP 740) and the provenance is shown on PyPI under
      # the "Provenance" information for the release files.
      - name: Publish distribution 📦 to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
